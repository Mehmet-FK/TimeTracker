name: Android debug APK
# Manual: Actions > "Android debug APK" > Run workflow. The APK is attached to the run as an
# artifact (kept 14 days). Debug build, signed with Gradle's debug key; not for the Play Store.
on:
  workflow_dispatch:
    inputs: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest   # Android SDK is preinstalled on the runner
    timeout-minutes: 45
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0     # tools/git-version.js reads the git history

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-deps

      - name: Set up JDK 21   # android/app/build.gradle: JavaVersion.VERSION_21
        uses: actions/setup-java@v4   # pin to a commit SHA like the other actions
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build web app, sync Capacitor, assemble debug APK
        run: npm run dist:android

      - name: Upload APK
        uses: actions/upload-artifact@v4   # pin to a commit SHA like the other actions
        with:
          name: timetracker-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
