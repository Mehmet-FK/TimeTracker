name: CI
on:
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/wiki/**'
  workflow_dispatch:
    inputs: {}
  release:
    types: [published]
permissions:
  contents: read

# Superseded PR pushes cancel the old run; release and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Verify package-lock.json only uses the official npm registry.
  # Prevents contributors using mirror registries from rewriting all resolved URLs.
  check-lockfile-registry:
    name: Check package-lock.json registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Reject non-standard registry URLs
        run: |
          BAD_COUNT=$(grep '"resolved": "https\?://' package-lock.json | grep -cv 'registry.npmjs.org' || true)
          if [ "$BAD_COUNT" -gt 0 ]; then
            echo "::error::package-lock.json contains $BAD_COUNT resolved URLs pointing to a non-standard registry."
            echo "Examples:"
            grep '"resolved": "https\?://' package-lock.json | grep -v 'registry.npmjs.org' | head -5
            echo ""
            echo "Please delete node_modules and package-lock.json, then run 'npm install' with the default registry (https://registry.npmjs.org/)."
            exit 1
          fi

  # This job will scan dependency manifest files
  # surfacing known-vulnerable versions of the packages declared or updated.
  # Only runs on pull_request events as the action requires base/head refs
  dependency-vulnerability-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      # work around for npm installs from git+https://github.com/johannesjo/J2M.git
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

  # Required gate for the TimeTracker fork: lockfile, dependency review, lint, unit tests.
  # E2E and PWA/Lighthouse live in e2e.yml (manual) until they are stable.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-deps
      - run: npm run lint
      - name: Test issue-triage helpers
        run: node --test ".github/scripts/*.test.js"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      # Playwright chromium is needed by the video tool tests
      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e
      - name: Test video tools
        run: npm run video:kit-test -- --workers=1
      - run: npm run env # Generate env.generated.ts from environment variables
      - run: npm run int:test # Validate i18n JSON files
      - run: npm run test:electron # Node-side unit tests for electron/*.cjs
      - run: npm run test:ci

  # Single stable check to mark required in branch protection, so the split
  # and sharded jobs above can change without editing the protection rules.
  # Skipped jobs (PR-only checks on release runs) count as passing.
  # always(), not !cancelled(): a skipped required check would count as passing.
  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - check-lockfile-registry
      - dependency-vulnerability-review
      - lint
      - unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any CI job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          exit 1
