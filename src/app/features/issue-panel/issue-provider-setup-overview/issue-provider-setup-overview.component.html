<h4>Setup Issue Provider</h4>

<div class="items">
  <!-- Plugin providers are rendered via the pluginProviders / disabledPluginProviders loops below. -->
  <button
    class="provider-tile focus-ring"
    type="button"
    (click)="openSetupDialog('PLAINSPACE')"
  >
    <mat-icon svgIcon="plainspace"></mat-icon>
    <span>Plainspace</span>
  </button>
  @for (provider of pluginProviders; track provider.pluginId) {
    <button
      class="provider-tile focus-ring"
      type="button"
      (click)="openSetupDialog(provider.registeredKey)"
    >
      @if (provider.icon && provider.icon !== 'extension') {
        <mat-icon [svgIcon]="provider.icon"></mat-icon>
      } @else {
        <mat-icon>extension</mat-icon>
      }
      <span>{{ provider.name }}</span>
    </button>
  }
  @for (provider of disabledPluginProviders; track provider.pluginId) {
    <button
      class="provider-tile focus-ring"
      type="button"
      (click)="enablePluginAndOpenSetup(provider.pluginId, provider.issueProviderKey)"
    >
      @if (provider.icon && provider.icon !== 'extension') {
        <mat-icon [svgIcon]="provider.icon"></mat-icon>
      } @else {
        <mat-icon>extension</mat-icon>
      }
      <span>{{ provider.name }}</span>
    </button>
  }
</div>
