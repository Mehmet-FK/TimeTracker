<nav
  class="mobile-bottom-nav"
  [class.entrance]="isEntrance()"
  (animationend)="onEntranceAnimationEnd($event)"
>
  <button
    mat-button
    class="nav-button"
    routerLink="/time-entries"
    routerLinkActive="active"
    [attr.aria-label]="T.MH.TIME_ENTRIES | translate"
  >
    <mat-icon>timer</mat-icon>
  </button>

  <div class="fab-cell">
    <button
      mat-fab
      class="add-task-button"
      [class.smaller]="hasProjectBacklog()"
      [class.hide-for-native]="isEntranceAnimating()"
      color="primary"
      (click)="startNewEntry()"
      [attr.aria-label]="T.MH.START_NEW_TASK | translate"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <button
    mat-button
    class="nav-button"
    (click)="toggleMobileNav()"
    [attr.aria-label]="T.MH.PROJECT_MENU | translate"
  >
    <mat-icon>menu</mat-icon>
  </button>
</nav>
